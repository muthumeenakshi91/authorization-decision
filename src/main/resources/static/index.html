<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Authorization Portal</title>
</head>

<body>

    <h1>Authorization Portal</h1>

    <form id="authorizationForm">

        <label>Transaction ID:</label>
        <input type="text" id="transactionId" required>
        <br><br>

        <label>Card Number:</label>
        <input type="text" id="cardNumber" required>
        <br><br>

        <label>Amount:</label>
        <input type="number" id="amount" step="0.01" required>
        <br><br>

        <label>Currency:</label>
        <select id="currency">
            <option value="CAD">CAD</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
        </select>
        <br><br>

        <label>Merchant:</label>
        <input type="text" id="merchant" required>
        <br><br>

        <button type="submit" id="authorizeButton">
            Authorize
        </button>

    </form>

    <hr>

    <h2>Authorization Result</h2>

    <p>
        Decision:
        <span id="decision"></span>
    </p>

    <p>
        Reason:
        <span id="reason"></span>
    </p>

    <script>

        document
            .getElementById("authorizationForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const request = {
                    transactionId:
                        document.getElementById("transactionId").value,

                    cardNumber:
                        document.getElementById("cardNumber").value,

                    amount:
                        parseFloat(
                            document.getElementById("amount").value
                        ),

                    currency:
                        document.getElementById("currency").value,

                    merchant:
                        document.getElementById("merchant").value
                };

                const loginResponse = await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: "admin",
                            password: "password"
                        })
                    }
                );

                const loginResult = await loginResponse.json();

                const token = loginResult.token;

                const response = await fetch(
                    "/api/auth/authorize",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },

                        body: JSON.stringify(request)
                    }
                );

                const result = await response.json();

                document.getElementById("decision").textContent =
                    result.decision || "ERROR";

                document.getElementById("reason").textContent =
                    result.reason || result.message || "Request failed";
                
            });

    </script>

</body>

</html>
